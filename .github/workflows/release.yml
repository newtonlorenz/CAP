name: Release images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push versioned images to GHCR after release checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Validate selected release tag
        id: release
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3.12 - <<'PY'
          import os, re, subprocess
          ref = os.environ["RELEASE_REF"]
          sha = os.environ["RELEASE_SHA"]
          match = re.fullmatch(r"refs/tags/(v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))", ref)
          if not match:
              raise SystemExit("Select an exact vMAJOR.MINOR.PATCH tag to run this workflow.")
          tag = match.group(1)
          tagged = subprocess.check_output(["git", "rev-parse", "--verify", f"{tag}^{{commit}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tagged != sha or head != sha:
              raise SystemExit("Selected tag, GitHub event commit, and checkout do not match.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={tag}\nrevision={sha}\n")
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Install pinned image vulnerability scanner
        if: inputs.publish
        run: |
          SCANNER_DIR="$RUNNER_TEMP/grype-0.120.0"
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/anchore/grype/releases/download/v0.120.0/grype_0.120.0_linux_amd64.tar.gz \
            --output "$SCANNER_DIR/grype.tar.gz"
          printf '%s  %s\n' \
            a5a1218dce63acdac152a6b3b5bb366e7267e36f4069848cf455543b3fa5700e \
            "$SCANNER_DIR/grype.tar.gz" | sha256sum --check --strict
          tar -xzf "$SCANNER_DIR/grype.tar.gz" -C "$SCANNER_DIR" grype
          echo "$SCANNER_DIR" >> "$GITHUB_PATH"
      - name: Require successful CI for the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.revision }}
        run: |
          gh run list --repo "$GH_REPOSITORY" --workflow ci.yml --commit "$RELEASE_SHA" \
            --json headSha,status,conclusion --limit 20 > "$RUNNER_TEMP/ci-runs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          sha = os.environ["RELEASE_SHA"]
          runs = json.loads(Path(os.environ["RUNNER_TEMP"], "ci-runs.json").read_text())
          if not any(run.get("headSha") == sha and run.get("status") == "completed" and run.get("conclusion") == "success" for run in runs):
              raise SystemExit("No successful Verify workflow run exists for this exact commit.")
          PY
      - name: Build, verify and optionally push images
        id: images
        env:
          PUBLISH_IMAGES: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          REPOSITORY: ${{ github.repository }}
        run: |
          OUTPUT="$RUNNER_TEMP/release-output"
          if [ "$PUBLISH_IMAGES" = "true" ]; then
            printf '%s' "$GH_TOKEN" | docker --context default login ghcr.io --username "$GH_ACTOR" --password-stdin
            python3.12 scripts/release-images.py \
              --version "$VERSION" --expected-revision "$REVISION" \
              --repository "$REPOSITORY" --lifecycle --push --output "$OUTPUT"
          else
            python3.12 scripts/release-images.py \
              --version "$VERSION" --expected-revision "$REVISION" \
              --repository "$REPOSITORY" --lifecycle --draft --output "$OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.images.outcome != 'skipped'
        with:
          name: cap-release-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/release-output/
          if-no-files-found: error
          retention-days: 90
